services:
  - type: web
    name: foodizo-obunuzi-demo
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend --include=dev && npm --prefix backend run prisma:generate && npm --prefix backend run build
    startCommand: node scripts/render-start.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 127.0.0.1
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENTS_WEBHOOK_SECRET
        generateValue: true
