<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f6f1" />
  <link rel="icon" type="image/svg+xml" href="/images/foodizo-brand-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/css/customer_order.css?v=8" />
  <title>Foodizo &amp; Obunuzi | Menu and Ordering</title>
</head>
<body>
  <header class="customer-topbar">
    <a class="customer-brand" href="/" aria-label="Foodizo and Obunuzi home">
      <img src="/images/foodizo-obunuzi-logo.svg" alt="Foodizo and Obunuzi" />
    </a>
    <div class="customer-topbar-actions">
      <a class="customer-cart-nav" href="/order#cart" data-customer-cart aria-label="Open cart">
        <span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span>
        <span>Cart</span>
        <span class="customer-cart-nav-count" data-customer-cart-count hidden></span>
      </a>
      <a class="customer-back-link" href="/" data-customer-back>
        <span aria-hidden="true">←</span>
        <span>Back</span>
      </a>
      <span class="customer-pickup-label">Pickup &amp; local delivery</span>
    </div>
  </header>

  <main class="customer-main" id="main-content">
    <div id="notice" class="customer-notice" role="status" hidden></div>
    <section id="order-screen">
      <div class="customer-intro">
        <h1>Order for pickup or delivery</h1>
      </div>

      <div class="customer-controls">
        <label class="customer-field">
          <span>Restaurant outlet</span>
          <select id="outlet">
            <option value="FOODIZO_HAM_TOWERS">Foodizo · Ham Towers</option>
            <option value="OBUNUZI_YMCA">Obunuzi · Opposite YMCA</option>
          </select>
        </label>
        <label class="customer-field">
          <span>How would you like your order?</span>
          <select id="fulfillment">
            <option value="TAKEAWAY_PICKUP">Pickup · cash at counter</option>
            <option value="PHONE_DELIVERY">Delivery · cash on delivery</option>
          </select>
        </label>
        <label class="customer-field customer-search">
          <span>Find a meal</span>
          <input id="search" type="search" placeholder="Search the live menu" autocomplete="off" />
        </label>
      </div>
      <button id="cart-toggle" class="customer-cart-toggle" type="button" aria-controls="cart-panel" aria-expanded="false" hidden>
        <span>View cart</span>
        <strong id="cart-toggle-summary"></strong>
      </button>

      <div class="customer-layout">
        <section class="customer-menu">
          <div class="customer-category-row" id="categories" aria-label="Menu categories"></div>
          <div class="customer-menu-grid" id="menu" aria-live="polite">
            <div class="customer-empty">Loading today’s menu…</div>
          </div>
        </section>

        <aside class="customer-cart" id="cart-panel" aria-labelledby="cart-title" hidden>
          <div class="customer-cart-head">
            <div><h2 id="cart-title">Your cart</h2></div>
            <button id="cart-close" class="customer-cart-close" type="button" aria-label="Close cart">
              <span aria-hidden="true">×</span>
            </button>
          </div>
          <div id="cart-review">
            <div id="cart-lines" class="customer-cart-lines"></div>
            <button id="proceed-to-checkout" class="customer-primary-button" type="button">Proceed to checkout</button>
          </div>
          <form id="checkout-form" class="customer-checkout" hidden>
            <button id="checkout-back" class="customer-secondary-button" type="button">Back to cart</button>
            <div class="customer-delivery-fields" id="delivery-fields" hidden>
              <label class="customer-field">
                <span>Delivery area and fee</span>
                <select id="delivery-zone" name="deliveryZoneId" disabled>
                  <option value="">Choose your delivery area</option>
                </select>
              </label>
              <label class="customer-field">
                <span>Room, office, gate, or landmark</span>
                <input id="delivery-note" name="deliveryAddressNote" type="text" minlength="3" maxlength="160" placeholder="e.g. Mary Stuart Hall, Block B, Room 14" />
              </label>
            </div>
            <div class="customer-fee-row" id="delivery-fee-row" hidden><span>Delivery fee</span><strong id="delivery-fee">UGX 0</strong></div>
            <div class="customer-cart-total"><span>Total</span><strong id="cart-total">UGX 0</strong></div>
            <label class="customer-field"><span>Your name</span><input name="customerName" type="text" minlength="2" maxlength="80" autocomplete="name" required /></label>
            <label class="customer-field"><span>Mobile number</span><input name="customerPhone" type="tel" minlength="9" maxlength="20" placeholder="e.g. 0770 555 333" autocomplete="tel" required /></label>
            <button id="submit-order" class="customer-primary-button" type="submit" disabled>Place pickup order</button>
          </form>
        </aside>
      </div>
    </section>

    <section id="tracking-screen" class="customer-tracking" hidden aria-labelledby="tracking-title">
      <div class="tracking-card">
        <h1 id="tracking-title" aria-live="polite">Order status</h1>
        <div class="tracking-token"><span id="tracking-token-label">Pickup token</span><strong id="tracking-token"></strong></div>
        <div class="tracking-actions">
          <button class="customer-primary-button" id="tracking-refresh" type="button">Refresh status</button>
          <button class="customer-secondary-button" id="new-order" type="button">Start another order</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/customer-cart-navigation.js?v=1" defer></script>
  <script src="/js/customer-notifications.js?v=1" defer></script>
  <script src="/js/customer-order.js?v=6" defer></script>
  <script src="/js/customer-navigation.js" defer></script>
</body>
</html>
