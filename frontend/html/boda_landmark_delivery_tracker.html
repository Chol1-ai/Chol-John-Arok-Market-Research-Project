<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="../images/foodizo-brand-mark.svg" />
  <meta name="theme-color" content="#22231f" />
  <title>Track your order | Foodizo &amp; Obunuzi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" />
  <style>
    :root {
      color-scheme: dark;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: #f3f1ea;
      background: #22231f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: #22231f;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 1rem 1rem 6rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
    }

    .logo {
      width: 174px;
      height: 36px;
      object-fit: contain;
      object-position: left center;
      filter: brightness(1.8);
    }

    .home-link {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      gap: .35rem;
      padding: 0 .85rem;
      border: 1px solid #45463e;
      border-radius: 999px;
      background: #2b2c27;
      color: #e1e2d9;
      font-size: .75rem;
      font-weight: 700;
    }

    main {
      padding-top: 2rem;
    }

    .eyebrow {
      color: #a9d8b2;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: .55rem 0 .4rem;
      font-size: 1.8rem;
      letter-spacing: -.05em;
    }

    .intro {
      margin: 0;
      color: #b6b7ae;
      font-size: .88rem;
      line-height: 1.65;
    }

    .empty-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 1.5rem;
      padding: 1.5rem 1.25rem 1.75rem;
      border: 1px solid #41423b;
      border-radius: 1.25rem;
      background: #292a25;
      text-align: center;
      box-shadow: 0 12px 30px rgb(0 0 0 / 24%);
    }

    .bike-image {
      width: min(100%, 260px);
      height: 150px;
      object-fit: contain;
    }

    h2 {
      margin: 1rem 0 .5rem;
      font-size: 1.2rem;
      letter-spacing: -.03em;
    }

    .message {
      max-width: 310px;
      margin: 0;
      color: #b6b7ae;
      font-size: .82rem;
      line-height: 1.65;
    }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      margin-top: 1.25rem;
      padding: 0 1.2rem;
      border-radius: 999px;
      background: #245c3e;
      color: white;
      font-size: .8rem;
      font-weight: 700;
    }

    .button:hover {
      background: #194b30;
    }

    .button:disabled {
      cursor: wait;
      opacity: .7;
    }

    .tracker-notice {
      margin-top: 1rem;
      padding: .8rem 1rem;
      border: 1px solid #ebc7c0;
      border-radius: .8rem;
      background: #fff1ed;
      color: #8d2c20;
      font-size: .8rem;
      line-height: 1.5;
    }

    .tracker-card {
      align-items: stretch;
    }

    .tracker-card>.bike-image {
      align-self: center;
    }

    .tracker-form {
      display: grid;
      width: min(100%, 340px);
      gap: .55rem;
      margin-top: 1.25rem;
      text-align: left;
    }

    .tracker-form label {
      margin-top: .35rem;
      color: #d7d8d0;
      font-size: .75rem;
      font-weight: 700;
    }

    .tracker-form input,
    .tracker-form select {
      min-height: 46px;
      width: 100%;
      padding: 0 .8rem;
      border: 1px solid #505149;
      border-radius: .7rem;
      background: #32332d;
      color: #f3f1ea;
      font: inherit;
      font-size: .85rem;
    }

    .tracker-form input:focus,
    .tracker-form select:focus {
      border-color: #42865c;
      outline: 3px solid rgb(66 134 92 / 13%);
    }

    .tracker-form .button,
    .tracker-result .button {
      justify-self: center;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-size: .8rem;
      font-weight: 700;
    }

    .tracker-result {
      display: grid;
      justify-items: center;
      gap: .45rem;
      width: 100%;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #393a33;
    }

    .result-label {
      color: #a9d8b2;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .result-status {
      color: #f3f1ea;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .result-items {
      width: min(100%, 300px);
      margin: .25rem 0;
      padding-left: 1.25rem;
      color: #d0d1c9;
      font-size: .8rem;
      line-height: 1.6;
      text-align: left;
    }

    .result-updated {
      margin: 0;
      color: #b6b7ae;
      font-size: .68rem;
    }

    [hidden] {
      display: none !important;
    }

    nav {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: center;
      padding: .5rem 1rem calc(.5rem + env(safe-area-inset-bottom));
      border-top: 1px solid #41423b;
      background: rgb(34 35 31 / 94%);
      backdrop-filter: blur(12px);
    }

    .nav-inner {
      display: flex;
      width: min(100%, 448px);
      justify-content: space-around;
    }

    nav a {
      display: flex;
      min-width: 70px;
      min-height: 48px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .2rem;
      color: #b6b7ae;
      font-size: .65rem;
      font-weight: 600;
    }

    nav a[aria-current="page"] {
      color: #f07b6f;
    }

    .customer-cart-nav-count {
      min-width: 16px;
      height: 16px;
      display: inline-grid;
      place-items: center;
      padding: 0 4px;
      border-radius: 999px;
      background: #c83d2d;
      color: #fff;
      font-size: .55rem;
      font-weight: 800;
    }

    nav .material-symbols-outlined,
    .home-link .material-symbols-outlined {
      font-size: 22px;
    }

    a:focus-visible {
      outline: 3px solid #e28a34;
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <a href="/" aria-label="Foodizo and Obunuzi home">
        <img class="logo" src="../images/foodizo-obunuzi-logo.svg" alt="Foodizo and Obunuzi" />
      </a>
      <a class="home-link" href="/order" data-customer-back><span class="material-symbols-outlined"
          aria-hidden="true">arrow_back</span>Back</a>
    </header>
    <main>
      <span class="eyebrow">Live order tracking</span>
      <h1>Track your order</h1>
      <div id="tracker-notice" class="tracker-notice" role="status" hidden></div>
      <section class="empty-card tracker-card">
        <img class="bike-image" src="../images/royal-farms-boda.jpg"
          alt="Royal Farms-branded motorcycle ready for Kampala delivery" />
        <h2>Find your order</h2>
        <form id="tracker-form" class="tracker-form">
          <label for="tracker-token">Order token</label>
          <input id="tracker-token" name="token" type="text" inputmode="text" autocomplete="off" maxlength="24"
            placeholder="e.g. #012" required />
          <label for="tracker-outlet">Restaurant outlet</label>
          <select id="tracker-outlet" name="outlet" required>
            <option value="">Choose an outlet</option>
            <option value="FOODIZO_HAM_TOWERS">Foodizo · Ham Towers</option>
            <option value="OBUNUZI_YMCA">Obunuzi · Opposite YMCA</option>
          </select>
          <button id="tracker-submit" class="button" type="submit">Track order <span class="material-symbols-outlined"
              aria-hidden="true">arrow_forward</span></button>
        </form>
        <section id="tracker-result" class="tracker-result" aria-live="polite" hidden>
          <span class="result-label" id="result-channel">Order status</span>
          <strong id="result-status" class="result-status"></strong>
          <p id="result-order" class="message"></p>
          <p id="result-destination" class="message" hidden></p>
          <ul id="result-items" class="result-items"></ul>
          <p id="result-updated" class="result-updated"></p>
          <button id="tracker-refresh" class="button" type="button">Refresh status</button>
        </section>
      </section>
    </main>
  </div>
  <nav aria-label="Customer navigation">
    <div class="nav-inner">
      <a href="/order"><span class="material-symbols-outlined"
          aria-hidden="true">restaurant</span><span>Order</span></a>
      <a href="/tracker"><span class="material-symbols-outlined"
          aria-hidden="true">confirmation_number</span><span>Track</span></a>
      <a aria-current="page" href="/tracker"><span class="material-symbols-outlined"
          aria-hidden="true">two_wheeler</span><span>Delivery</span></a>
      <a href="/order#cart" data-customer-cart aria-label="Open cart"><svg width="22" height="22" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true" focusable="false">
          <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 1.9-1.5L22 8H6" />
          <circle cx="10" cy="20" r="1" />
          <circle cx="18" cy="20" r="1" />
        </svg><span>Cart</span><span class="customer-cart-nav-count" data-customer-cart-count hidden></span></a>
    </div>
  </nav>
  <script src="/js/customer-cart-navigation.js?v=1" defer></script>
  <script src="/js/customer-notifications.js?v=1" defer></script>
  <script src="/js/customer-navigation.js" defer></script>
  <script src="/js/customer-tracker.js?v=2" defer></script>
</body>

</html>
