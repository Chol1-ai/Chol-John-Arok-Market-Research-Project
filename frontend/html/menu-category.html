<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f6f1" />
  <title>Current menu | Foodizo &amp; Obunuzi</title>
  <link rel="icon" type="image/svg+xml" href="/images/foodizo-brand-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/css/customer_order.css?v=8" />
</head>
<body>
  <header class="customer-topbar">
    <a class="customer-brand" href="/" aria-label="Foodizo and Obunuzi home">
      <img src="/images/foodizo-obunuzi-logo.svg" alt="Foodizo and Obunuzi" />
    </a>
    <div class="customer-topbar-actions">
      <a class="customer-cart-nav" href="/order#cart" data-customer-cart aria-label="Open cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 1.9-1.5L22 8H6" />
          <circle cx="10" cy="20" r="1" />
          <circle cx="18" cy="20" r="1" />
        </svg>
        <span>Cart</span>
        <span class="customer-cart-nav-count" data-customer-cart-count hidden></span>
      </a>
      <a class="customer-back-link" href="/" data-customer-back>
        <span aria-hidden="true">←</span>
        <span>Back</span>
      </a>
    </div>
  </header>
  <main class="customer-main">
    <section class="customer-intro"><h1>Current menu</h1></section>
  </main>
  <script src="/js/menu-category.js?v=20261113"></script>
  <script src="/js/customer-cart-navigation.js?v=1" defer></script>
  <script src="/js/customer-navigation.js" defer></script>
</body>
</html>
