<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="../images/foodizo-brand-mark.svg" />
  <meta name="theme-color" content="#f9f9ff" />
  <title>My Pickup Token | Foodizo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" />
  <style>
    :root {
      color-scheme: light;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: #202a24;
      background: #f9f9ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 1rem 1rem 6rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
    }

    .logo {
      width: 174px;
      height: 36px;
      object-fit: contain;
      object-position: left center;
    }

    .home-link {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      gap: .35rem;
      padding: 0 .85rem;
      border-radius: 999px;
      background: #e9edff;
      font-size: .75rem;
      font-weight: 700;
    }

    main {
      padding-top: 2rem;
    }

    .eyebrow {
      color: #00682b;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: .55rem 0 .4rem;
      font-size: 1.8rem;
      letter-spacing: -.05em;
    }

    .intro {
      margin: 0;
      color: #5c6670;
      font-size: .88rem;
      line-height: 1.65;
    }

    .empty-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 1.5rem;
      padding: 2rem 1.25rem;
      border: 1px solid #e1e8fd;
      border-radius: 1.25rem;
      background: white;
      text-align: center;
      box-shadow: 0 12px 30px rgb(20 27 43 / 6%);
    }

    .icon-wrap {
      display: grid;
      width: 68px;
      height: 68px;
      place-items: center;
      border-radius: 22px;
      background: #fff0e8;
      color: #c83d2d;
    }

    .icon-wrap .material-symbols-outlined {
      font-size: 34px;
    }

    h2 {
      margin: 1.1rem 0 .5rem;
      font-size: 1.2rem;
      letter-spacing: -.03em;
    }

    .message {
      max-width: 310px;
      margin: 0;
      color: #68716b;
      font-size: .82rem;
      line-height: 1.65;
    }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      margin-top: 1.25rem;
      padding: 0 1.2rem;
      border-radius: 999px;
      background: #245c3e;
      color: white;
      font-size: .8rem;
      font-weight: 700;
    }

    .button:hover {
      background: #194b30;
    }

    nav {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: center;
      padding: .5rem 1rem calc(.5rem + env(safe-area-inset-bottom));
      border-top: 1px solid #e1e8fd;
      background: rgb(249 249 255 / 94%);
      backdrop-filter: blur(12px);
    }

    .nav-inner {
      display: flex;
      width: min(100%, 448px);
      justify-content: space-around;
    }

    nav a {
      display: flex;
      min-width: 70px;
      min-height: 48px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .2rem;
      color: #68716b;
      font-size: .65rem;
      font-weight: 600;
    }

    nav a[aria-current="page"] {
      color: #b70011;
    }

    nav .material-symbols-outlined {
      font-size: 22px;
    }

    a:focus-visible {
      outline: 3px solid #e28a34;
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <a href="customer_pwa_landing_page.html" aria-label="Foodizo and Obunuzi home">
        <img class="logo" src="../images/foodizo-obunuzi-logo.svg" alt="Foodizo and Obunuzi" />
      </a>
      <a class="home-link" href="campus_pre_order_menu.html"><span class="material-symbols-outlined"
          aria-hidden="true">restaurant_menu</span>Menu</a>
    </header>
    <main>
      <span class="eyebrow">Pickup</span>
      <h1>My token</h1>
      <p class="intro">Your pickup details will be here when an order is ready for collection.</p>
      <section class="empty-card" aria-live="polite">
        <div class="icon-wrap"><span class="material-symbols-outlined" aria-hidden="true">confirmation_number</span>
        </div>
        <h2>No pickup token yet</h2>
        <p class="message">A token appears after an order is confirmed.</p>
        <a class="button" href="campus_pre_order_menu.html">Browse the menu <span class="material-symbols-outlined"
            aria-hidden="true">arrow_forward</span></a>
      </section>
    </main>
  </div>
  <nav aria-label="Customer navigation">
    <div class="nav-inner">
      <a href="campus_pre_order_menu.html"><span class="material-symbols-outlined"
          aria-hidden="true">restaurant</span><span>Menu</span></a>
      <a aria-current="page" href="digital_token_queue_bypass_status.html"><span class="material-symbols-outlined"
          aria-hidden="true">confirmation_number</span><span>My Token</span></a>
      <a href="boda_landmark_delivery_tracker.html"><span class="material-symbols-outlined"
          aria-hidden="true">two_wheeler</span><span>Delivery</span></a>
    </div>
  </nav>
  <script src="../js/customer_prototype_ui.js?v=6" defer></script>
</body>

</html>
